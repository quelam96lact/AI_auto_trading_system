services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading}
      POSTGRES_DB: trading
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data"]
    ports: ["127.0.0.1:4222:4222"]
    volumes: [natsdata:/data]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
  # ISO-1: NATS RIÊNG cho test (cổng 4223) — tách khỏi stack thật để suite
  # không bao giờ đụng stream/consumer của hệ thống đang chạy (sự cố 13/08:
  # suite xóa durable consumer engine thật + purge BARS + ghi đè engine_state).
  # Volume RIÊNG (không dùng chung natsdata). profiles: ["test"] — `docker
  # compose up -d` thường KHÔNG khởi động nó; chạy test thì:
  #   docker compose --profile test up -d nats-test
  nats-test:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data"]
    ports: ["127.0.0.1:4223:4222"]
    volumes: [natsdata-test:/data]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    profiles: ["test"]
  engine:
    build: .
    command: python -m trading.engine.main --config config/config.yaml
    environment:
      DB_DSN: postgresql://trading:${POSTGRES_PASSWORD:-trading}@postgres:5432/trading
      # BAT BUOC: config.yaml mac dinh nats://localhost:4222 (dung cho dev chay
      # thang tren host). Trong container, localhost la CHINH container do nen
      # engine khong bao gio ket noi duoc NATS. Collector da co dong nay tu dau,
      # engine thi thieu — engine chua bao gio chay duoc trong Docker.
      NATS_URL: nats://nats:4222
      SSI_CONSUMER_ID: ${SSI_CONSUMER_ID}
      SSI_CONSUMER_SECRET: ${SSI_CONSUMER_SECRET}
      SSI_API_KEY: ${SSI_API_KEY}
      SSI_API_SECRET: ${SSI_API_SECRET}
      SSI_PRIVATE_KEY: ${SSI_PRIVATE_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    depends_on:
      postgres: {condition: service_healthy}
      nats: {condition: service_started}
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
  collector:
    build: .
    command: python -m trading.collector.main --config config/config.yaml
    environment:
      DB_DSN: postgresql://trading:${POSTGRES_PASSWORD:-trading}@postgres:5432/trading
      NATS_URL: nats://nats:4222
      SSI_CONSUMER_ID: ${SSI_CONSUMER_ID}
      SSI_CONSUMER_SECRET: ${SSI_CONSUMER_SECRET}
      SSI_API_KEY: ${SSI_API_KEY}
      SSI_API_SECRET: ${SSI_API_SECRET}
      SSI_PRIVATE_KEY: ${SSI_PRIVATE_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
    depends_on:
      postgres: {condition: service_healthy}
      nats: {condition: service_started}
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    volumes:
      - ./logs:/app/logs
  grafana:
    image: grafana/grafana:11.2.0
    # 127.0.0.1: Grafana KHONG duoc mo thang ra internet. Dat sau nginx+TLS
    # neu can truy cap tu xa (DEPLOYMENT.md §4), hoac dung SSH tunnel.
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
volumes:
  pgdata:
  natsdata:
  natsdata-test:
