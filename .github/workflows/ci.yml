name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Ghim 3.11 cho khop may dev (3.11.15). Truoc day ghim 3.12 -> CI
          # chay tren interpreter khac han cho dev, sai lech se lo ra muon.
          python-version: "3.11"

      - name: Install deps
        run: uv sync --extra dev --frozen

      # scripts/ nam trong pham vi lint tu 2026-08-18: 8 loi pre-existing da
      # duoc don. scripts/ chua confirm_real_order.py va heartbeat_check.py
      # (dead-man's switch) nen de ngoai lint la de ho dung cho quan trong nhat.
      - name: Ruff
        run: uv run ruff check trading tests scripts

      # Bo qua test integration: chung can Postgres/NATS that dang chay.
      - name: Pytest
        run: uv run pytest -m "not integration" -q
